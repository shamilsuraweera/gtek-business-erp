services:
  postgres:
    image: postgres:16-alpine
    container_name: gtek-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gtek_erp}
      POSTGRES_USER: ${POSTGRES_USER:-gtek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtek-development-only}
    ports:
      - "5432:5432"
    volumes:
      - gtek-erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtek} -d ${POSTGRES_DB:-gtek_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gtek-erp-postgres-data:
